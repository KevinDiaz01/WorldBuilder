name: Release WorldBuilder
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and source
        shell: bash
        run: |
          test -f app/main.py
          test -f app/updater.py
          test -f scripts/make_update.py
          VERSION="${GITHUB_REF_NAME#v}"
          grep -F "VERSION='$VERSION'" app/main.py
      - name: Build update assets
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/make_update.py "$VERSION" .
          python3 - <<'PY'
          import hashlib,os,pathlib
          version=os.environ['GITHUB_REF_NAME'][1:]
          p=pathlib.Path(f'WorldBuilder-v{version}-update.zip')
          checksum=pathlib.Path(str(p)+'.sha256').read_text().split()[0]
          assert hashlib.sha256(p.read_bytes()).hexdigest()==checksum
          print('Update ZIP and SHA256 validated')
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "WorldBuilder-v$VERSION-update.zip" \
            "WorldBuilder-v$VERSION-update.zip.sha256" \
            --title "WorldBuilder v$VERSION" \
            --notes "WorldBuilder update v$VERSION. Download through the in-app updater." \
            --verify-tag
