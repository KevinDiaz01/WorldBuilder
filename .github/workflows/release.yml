name: Release WorldBuilder
# Legacy 2D publishing is retired. 3D release automation lives in unity-windows-build.yml.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: worldbuilder-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source and version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          test -f app/main.py
          test -f app/updater.py
          test -f scripts/make_update.py
          grep -F "VERSION='$VERSION'" app/main.py
          python3 -m compileall -q app scripts
      - name: Build update package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          python3 scripts/make_update.py "$VERSION" .
          sha256sum -c "WorldBuilder-v$VERSION-update.zip.sha256"
      - name: Publish version if missing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no overwrite."
            exit 0
          fi
          gh release create "$TAG" \
            "WorldBuilder-v$VERSION-update.zip" \
            "WorldBuilder-v$VERSION-update.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "WorldBuilder $TAG" \
            --notes "WorldBuilder $TAG update. Install via Check updates in the app."
